# ========================================================
# Practical 11: Containerization with Docker & Docker Compose
# Multi-Tier Container Orchestration
# Services: Frontend (Nginx), Backend (Node/Express), Database (MongoDB)
# ========================================================

version: '3.8'

services:
  # Database Service: MongoDB
  mongodb:
    image: mongo:7.0
    container_name: taskmgr-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taskdb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - taskmgr-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Backend Service: Node.js & Express REST API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmgr-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: supersecretjwtkeyforpracticals
      DOCKER_CONTAINER: "true"
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskmgr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend Service: React Vite Single Page App with Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmgr-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskmgr-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

# Isolated Bridge Network for Inter-Container Communication
networks:
  taskmgr-network:
    driver: bridge

# Persistent Volume for MongoDB Database Data
volumes:
  mongo_data:
    driver: local
