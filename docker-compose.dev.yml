# ========================================================
# Practical 11: Docker Compose Local Development Override
# Supports hot-reloading with host bind mounts
# ========================================================

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskmgr-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - taskmgr-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmgr-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/taskdb
      JWT_SECRET: supersecretjwtkeyforpracticals
      DOCKER_CONTAINER: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongodb
    networks:
      - taskmgr-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmgr-frontend-dev
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - taskmgr-dev-network

networks:
  taskmgr-dev-network:
    driver: bridge

volumes:
  mongo_data_dev:
    driver: local
